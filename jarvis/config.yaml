name: Jarvis
version: "0.1.0"
slug: jarvis
description: Persönlicher Assistent – sortiert Mails, meldet Wichtiges per WhatsApp und ruft bei Dringendem an.
url: https://github.com/rodrigobatista2606-bot/Jarvis
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
options:
  anthropic_api_key: ""
  model: claude-opus-5-5
  gmail_address: ""
  gmail_app_password: ""
  outlook_enabled: false
  outlook_client_id: ""
  twilio_account_sid: ""
  twilio_auth_token: ""
  twilio_whatsapp_from: ""
  twilio_call_from: ""
  whatsapp_template_sid: ""
  my_phone: ""
  call_voice: Polly.Vicki
  test_mode: true
  check_interval_minutes: 10
  evening_call_enabled: true
  evening_call_time: "19:00"
  quiet_start: "22:00"
  quiet_end: "07:00"
  timezone: Europe/Berlin
  days_back_on_first_start: 1
  never_delete: []
  always_urgent: []
  extra_instructions: ""
schema:
  anthropic_api_key: password
  model: str
  gmail_address: str?
  gmail_app_password: password?
  outlook_enabled: bool
  outlook_client_id: str?
  twilio_account_sid: str?
  twilio_auth_token: password?
  twilio_whatsapp_from: str?
  twilio_call_from: str?
  whatsapp_template_sid: str?
  my_phone: str
  call_voice: str
  test_mode: bool
  check_interval_minutes: int(2,120)
  evening_call_enabled: bool
  evening_call_time: match(^([01]\d|2[0-3]):[0-5]\d$)
  quiet_start: match(^([01]\d|2[0-3]):[0-5]\d$)
  quiet_end: match(^([01]\d|2[0-3]):[0-5]\d$)
  timezone: str
  days_back_on_first_start: int(0,7)
  never_delete:
    - str
  always_urgent:
    - str
  extra_instructions: str?
